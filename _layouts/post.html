---
layout: default
---
<main id="main" class="shell reading-page">
  <article class="prose">
    <p class="eyebrow"><a href="{{ '/posts/' | relative_url }}">Writing</a></p>
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time> · Stefan Mai</p>
    {{ content }}
    <div class="article-end"><a href="{{ '/posts/' | relative_url }}">← All posts</a></div>
  </article>
</main>
