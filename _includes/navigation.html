<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header shell">
  <a class="site-name" href="{{ '/' | relative_url }}">Stefan Mai<span aria-hidden="true">.</span></a>
  <nav aria-label="Main navigation">
    {% for link in site.links %}
    <a href="{% if link.external %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}"{% if page.url contains link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
    {% endfor %}
    <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
  </nav>
</header>
